gitlab_url: "https://gitlab.com"
scope:
  projects:
    - "henixdevelopment/sandbox/lmz/gotlem-sandbox"
comment_prefix: "### 🤖 GotLem Analysis\n"
comment_suffix: "\n\n_Auto-generated by GotLem_"
rules:
  - name: "No Milestone"
    version: 1
    perimeter: "{{#if (hasNoMilestone)}}true{{/if}}"
    comment: |
      This issue has no milestone. I am setting the milestone to "{{getCurrentMilestone}}"
      /milestone %"{{getCurrentMilestone}}"
